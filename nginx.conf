events {}

http {
    upstream vinylshop_app {
        server web:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Admin panel: only reachable from inside the Docker network (edge/backend),
        # never directly from outside — illustrates edge-level access control for a
        # sensitive management interface. In a real deployment this range would be
        # the VPN/office subnet, not the container network itself.
        location /Admin/ {
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://vinylshop_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://vinylshop_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
